<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Первый штукатурный</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23050505'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-size='26' font-family='Arial' font-weight='700' fill='white'%3E1Ш%3C/text%3E%3C/svg%3E">
  <script src="./vendor/chart.umd.min.js"></script>
  <script type="module" src="./src/app.js?v=2026-05-11-dark-dashboard-v14"></script>
  <link rel="stylesheet" href="./src/styles.css?v=2026-05-11-dark-dashboard-v14">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">1Ш</span>
        <div>
          <strong>Первый штукатурный</strong>
          <span>дашборд из Excel</span>
        </div>
      </div>

      <nav class="nav" id="appNav"></nav>

      <div class="sidebar-footer">
        <span>Данные только из</span>
        <strong>папки “заказчик”</strong>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <p class="section-label" id="sectionLabel">Операционная ветка</p>
          <h1 id="pageTitle">Обзор</h1>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" id="seedButton" title="Обновить текущую страницу">↻</button>
          <button class="primary-button" id="primaryAction">Новый объект</button>
        </div>
      </header>

      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">Форма</h2>
        <button class="icon-button" id="closeModal" title="Закрыть">×</button>
      </div>
      <form id="modalForm" class="form-grid"></form>
    </div>
  </div>
</body>
</html>
